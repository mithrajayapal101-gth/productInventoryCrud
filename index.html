<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Inventory CRUD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <input type="text" id="Update" hidden>
        <h1 class="text-center text-primary">Product Inventory CRUD Application</h1>
        <form id="userform">
            <div class="row my-5">
                <div class="col-lg-2">
                    <input id="pid" type="text" placeholder="Product ID" class="form-control">
                </div>
                <div class="col-lg-3">
                    <input id="pname" type="text" placeholder="Product Name" class="form-control">
                </div>
                <div class="col-lg-2">
                    <input id="price" type="number" placeholder="Price" class="form-control">
                </div>
                <div class="col-lg-2">
                    <input id="quantity" type="number" placeholder="Quantity" class="form-control">
                </div>
                <div class="col-lg-3">
                    <button class="btn btn-success w-100">Save Product</button>
                </div>
            </div>
        </form>
        <div class="d-flex justify-content-between my-4">
            <h5>Total Products: <span id="total" class="text-primary">0</span></h5>
            <h5>Low Stock Products: <span id="lowstock" class="text-danger">0</span></h5>
        </div>
        <table class="table table-bordered table-hover my-5">
            <thead class="table-dark text-center">
                <tr>
                    <th>#</th>
                    <th>Product ID</th>
                    <th>Product Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Availability</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tablebody"></tbody>
        </table>
    </div>
    <script src="./main.js"></script>
</body>
</html>
